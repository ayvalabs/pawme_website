Quick checks in TikTok Developer Portal
Open your app in TikTok for Developers and verify:
	1.	Client key matches exactly
	•	Copy the  Client key  from the dashboard and compare it with  aw2su2yzgvx13mxm  in your URL character by character.
	•	Make sure there is no extra space or hidden character in your env variable.
	2.	Correct app type / platform
	•	Confirm the app is configured for Web Login / Login Kit for Web and not only for Mobile (Android/iOS) or Minis. Using a mobile-only client_key for a pure web OAuth can trigger client_key-related authorization errors.
	3.	Scopes are allowed for this app
	•	Check the “Permissions/Scopes” section: your app must have  user.info.basic ,  user.info.stats , and  video.list  enabled/approved for web authorization.
	•	If any of these scopes are not available or still pending, reduce the  scope  parameter to only what is approved and try again.
	4.	Redirect URL is registered and matches
	•	In the app’s settings, find the Redirect URL / Callback URL list.
	•	Add exactly:  http://localhost:3000/api/tiktok/callback  (or the HTTPS URL you actually use).
	•	The value in your code must exactly match the one in the portal: same scheme ( http  vs  https ), host, port, and path.
Things to adjust in your code / config
	•	Keep your current URL shape (PKCE looks fine now) but ensure:
	•	 client_key  is the one from the same app where you configured the redirect and scopes.
	•	You’re not accidentally using a different app’s key between local and production envs.
	•	 scope  is a comma-separated list with no spaces: user.info.basic,video.list,user.info.stats  before URL-encoding.
	•	If your app is still in development or review, verify that TikTok allows login for your own account; some apps are restricted to test users only, others can’t use certain scopes until approved.
Minimal working checklist
You should be able to pass the authorize step when all of these are true:
	1.	TikTok app status is active, with Web Login enabled.
	2.	 client_key  in your URL exactly equals the portal’s client key.
	3.	 redirect_uri  exactly matches one of the redirect URLs in the portal.
	4.	Requested scopes are enabled for the app.
	5.	Your URL includes PKCE params ( code_challenge ,  code_challenge_method=S256 ) as you have now.
If you can share (sanitised) screenshots of your TikTok app settings (app type, platforms, redirect URL list, scopes) or the code that builds the authorize URL (with secrets removed), I can pinpoint which of these is failing and suggest the exact change.